AWSTemplateFormatVersion: "2010-09-09"
Description: "Standalone VPC + GPU Auto Scaling Group running Ollama + LiteLLM for Claude Code CLI"

Parameters:
  ProjectName:
    Type: String
    Default: OllamaQwQHost
    Description: Project name used for resource naming prefix.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the dedicated VPC.

  PrimaryInstanceType:
    Type: String
    Default: g5.2xlarge
    AllowedValues: [g5.2xlarge, g5.4xlarge, g6e.2xlarge, g6e.4xlarge]
    Description: Primary EC2 GPU instance type (24GB A10G).

  FallbackInstanceType:
    Type: String
    Default: g6e.2xlarge
    AllowedValues: [g5.2xlarge, g5.4xlarge, g6e.2xlarge, g6e.4xlarge]
    Description: Fallback GPU instance type if primary type is out of capacity (48GB L40S).

  MarketType:
    Type: String
    Default: on-demand
    AllowedValues: [on-demand, spot]
    Description: Run as standard on-demand or cost-saving spot instance.

  OllamaModel:
    Type: String
    Default: qwq
    Description: Base Ollama model to pull on deployment.

  VolumeSize:
    Type: Number
    Default: 120
    Description: Root volume size in GB.

  AMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/jammy/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: Latest Ubuntu 22.04 LTS AMI ID.

Conditions:
  UseSpotInstance: !Equals [!Ref MarketType, "spot"]

Resources:
  # ==========================================================
  # NETWORK INFRASTRUCTURE (VPC, Subnets, Routing)
  # ==========================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-subnet-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ==========================================================
  # SECURITY & IAM
  # ==========================================================
  ApplicationKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub ${ProjectName}-generated-key
      KeyType: rsa
      KeyFormat: pem
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-key-pair

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-EC2InstanceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-sg
      GroupDescription: Allow SSH access only. Ports 11434 and 4000 are accessed via SSH Tunneling.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access for CLI management and port tunneling
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sg

  # ==========================================================
  # LAUNCH TEMPLATE & AUTO SCALING GROUP
  # ==========================================================
  EC2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        KeyName: !Ref ApplicationKeyPair
        ImageId: !Ref AMI
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: !Ref VolumeSize
              VolumeType: gp3
              Iops: 3000
              Throughput: 500
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eux

            # 1. System packages
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get upgrade -y
            apt-get install -y ubuntu-drivers-common curl jq software-properties-common python3-pip

            # 2. NVIDIA drivers
            ubuntu-drivers autoinstall

            # 3. Ollama
            curl -fsSL https://ollama.com/install.sh | sh

            # 4. Ollama systemd tuning
            mkdir -p /etc/systemd/system/ollama.service.d
            cat <<EOF > /etc/systemd/system/ollama.service.d/override.conf
            [Service]
            Environment="OLLAMA_MAX_LOADED_MODELS=1"
            Environment="OLLAMA_NUM_PARALLEL=1"
            Environment="OLLAMA_KEEP_ALIVE=-1"
            Environment="OLLAMA_CONTEXT_LENGTH=32768"
            EOF

            systemctl daemon-reload
            systemctl enable --now ollama

            # 5. LiteLLM Proxy Setup
            pip3 install litellm

            mkdir -p /etc/litellm
            cat <<EOF > /etc/litellm/config.yaml
            model_list:
              - model_name: qwq:32k
                litellm_params:
                  model: ollama/qwq:32k
                  api_base: http://127.0.0.1:11434
            EOF

            cat <<EOF > /etc/systemd/system/litellm.service
            [Unit]
            Description=LiteLLM Proxy Service for Claude CLI
            After=network.target ollama.service
            Wants=ollama.service

            [Service]
            Type=simple
            User=root
            ExecStart=/usr/local/bin/litellm --config /etc/litellm/config.yaml --port 4000
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable --now litellm

            # 6. Model setup & prime VRAM
            cat <<'EOF' > /tmp/setup_models.sh
            #!/bin/bash
            until nvidia-smi > /dev/null 2>&1; do
                sleep 5
            done

            ollama pull ${OllamaModel}

            echo "FROM ${OllamaModel}" > /tmp/Modelfile
            echo "PARAMETER num_ctx 32768" >> /tmp/Modelfile
            ollama create qwq:32k -f /tmp/Modelfile

            ollama run qwq:32k "Ready" > /dev/null 2>&1
            EOF

            chmod +x /tmp/setup_models.sh
            nohup /tmp/setup_models.sh > /var/log/model_setup.log 2>&1 &

  EC2AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${ProjectName}-asg
      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandAllocationStrategy: lowest-price
          SpotAllocationStrategy: capacity-optimized
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref EC2LaunchTemplate
            Version: !GetAtt EC2LaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: !Ref PrimaryInstanceType
            - InstanceType: !Ref FallbackInstanceType
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-instance
          PropagateAtLaunch: true

Outputs:
  SSMPrivateKeyCommand:
    Description: Step 1 - Retrieve SSH Private Key.
    Value: !Sub "aws ssm get-parameter --name /ec2/keypair/${ApplicationKeyPair.KeyPairId} --with-decryption --query Parameter.Value --output text > private_key.pem && chmod 400 private_key.pem"

  GetPublicIPCommand:
    Description: Step 2 - Fetch the public IP of the auto-scaled instance once healthy.
    Value: !Sub "aws ec2 describe-instances --filters \"Name=tag:Name,Values=${ProjectName}-instance\" \"Name=instance-state-name,Values=running\" --query \"Reservations[*].Instances[*].PublicIpAddress\" --output text"

  LiteLLMTunnelCommand:
    Description: Step 3 - Run SSH Tunneling replacing <PUBLIC_IP> with the output from Step 2.
    Value: "ssh -i private_key.pem -N -L 4000:localhost:4000 ubuntu@<PUBLIC_IP>"

  ClaudeSettingsConfig:
    Description: Step 4 - Add this content to your local settings-ollama.json file.
    Value: '{"env": {"ANTHROPIC_BASE_URL": "http://localhost:4000", "ANTHROPIC_API_KEY": "sk-1234"}}'

  ClaudeLaunchCommand:
    Description: Step 5 - Launch Claude CLI.
    Value: "claude --settings ./settings-ollama.json --model qwq:32k"