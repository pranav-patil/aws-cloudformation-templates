AWSTemplateFormatVersion: "2010-09-09"
Description: "Ubuntu EC2 running Ollama with Alibaba QwQ-32B for Claude Code (via SSH Tunneling)"

Parameters:
  ProjectName:
    Type: String
    Default: OllamaQwQHost
    Description: Project name used for naming resources.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the existing VPC to deploy the instance into.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: ID of the existing public subnet to deploy the instance into.

  InstanceType:
    Type: String
    Default: g5.2xlarge
    AllowedValues: [g5.2xlarge, g5.4xlarge, g6e.2xlarge, g6e.4xlarge]
    Description: EC2 instance type. g5.2xlarge (24GB A10G) is the minimum recommended for QwQ-32B (Q4 quantization). g6e provides 48GB L40S.

  MarketType:
    Type: String
    Default: on-demand
    AllowedValues: [on-demand, spot]
    Description: Choose whether to run as a standard on-demand instance or a cost-saving spot instance.

  OllamaModel:
    Type: String
    Default: qwq
    Description: The Ollama model tag to pull and run by default (e.g., qwq, qwq:32b, llama3).

  VolumeSize:
    Type: Number
    Default: 100
    Description: Root volume size in GB. 32B parameter models require ~20GB of space each.

  AMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-24.04/latest/ami-id
    Description: Latest Ubuntu 22.04 LTS (Jammy Jellyfish). Headless NVIDIA drivers are installed on boot.

Conditions:
  UseSpotInstance: !Equals [!Ref MarketType, "spot"]

Resources:
  # --- Key Pair ---
  ApplicationKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub ${ProjectName}-generated-key
      KeyType: rsa
      KeyFormat: pem
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-key-pair

  # --- IAM Role and Instance Profile ---
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-EC2InstanceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  # --- Security Group ---
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-sg
      GroupDescription: Allow SSH access. Ollama 11434 is INTENTIONALLY NOT exposed to the internet.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access from anywhere (Use SSH Tunneling to access Ollama)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sg

  # --- Launch Template (Handles Spot vs On-Demand cleanly) ---
  EC2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        KeyName: !Ref ApplicationKeyPair
        ImageId: !Ref AMI
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        InstanceMarketOptions: !If
          - UseSpotInstance
          - MarketType: spot
            SpotOptions:
              SpotInstanceType: one-time
          - !Ref "AWS::NoValue"
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: !Ref VolumeSize
              VolumeType: gp3
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eux
            
            echo "Waiting for internet connectivity..."
            for i in {1..30}; do
                if curl -s -I http://us-east-1.ec2.archive.ubuntu.com > /dev/null; then
                    break
                else
                    sleep 10
                fi
            done

            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get upgrade -y
            
            apt-get install -y ubuntu-drivers-common curl jq software-properties-common
            
            echo "Installing NVIDIA drivers..."
            ubuntu-drivers autoinstall

            echo "Installing Ollama..."
            curl -fsSL https://ollama.com/install.sh | sh

            mkdir -p /etc/systemd/system/ollama.service.d
            cat <<EOF > /etc/systemd/system/ollama.service.d/override.conf
            [Service]
            Environment="OLLAMA_MAX_LOADED_MODELS=1"
            Environment="OLLAMA_NUM_PARALLEL=1"
            Environment="OLLAMA_KEEP_ALIVE=15m"
            EOF
            
            # Enable Ollama so it boots automatically after restarts
            systemctl daemon-reload
            systemctl enable ollama

            # Create a one-time startup script to pull the model AFTER the GPU reboot completes
            cat <<'EOF' > /var/lib/cloud/scripts/per-boot/pull_model.sh
            #!/bin/bash
            if ! ollama list | grep -q "${OllamaModel}"; then
                ollama pull ${OllamaModel}
            fi
            EOF
            chmod +x /var/lib/cloud/scripts/per-boot/pull_model.sh

            echo "Setup script completed. Rebooting to activate GPU..."
            shutdown -r +1 "Rebooting to activate NVIDIA GPU modules"

  # --- EC2 Instance Resource ---
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref EC2LaunchTemplate
        Version: !GetAtt EC2LaunchTemplate.LatestVersionNumber
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref InstanceSecurityGroup
          SubnetId: !Ref SubnetId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-instance

Outputs:
  InstancePublicIP:
    Description: Public IP address of the EC2 instance.
    Value: !GetAtt EC2Instance.PublicIp

  SSMPrivateKeyCommand:
    Description: Run this command locally to retrieve and save your private SSH key.
    Value: !Sub "aws ssm get-parameter --name /ec2/keypair/${ApplicationKeyPair.KeyPairId} --with-decryption --query Parameter.Value --output text > private_key.pem && chmod 400 private_key.pem"

  SSHTunnelCommand:
    Description: Run this to securely tunnel port 11434 to your local machine. Leave this terminal window running.
    Value: !Sub "ssh -i private_key.pem -N -L 11434:localhost:11434 ubuntu@${EC2Instance.PublicIp}"

  LoginCommand:
    Description: Run this for command line maintenance (no port forwarding).
    Value: !Sub "ssh -i private_key.pem ubuntu@${EC2Instance.PublicIp}"